<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ECF1EC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Mortgage Backed">
    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="src/assets/favicon-32.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="src/assets/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Create a game — Mortgage Backed Monopoly</title>
    <link rel="preload" href="src/assets/fonts/besley-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="src/css/tokens.css?v=2">
    <link rel="stylesheet" href="src/css/style.css?v=24">
</head>
<body>
    <div class="container">
        <header class="app-bar">
            <a class="app-bar-brand" href="index.html">Mortgage Backed Monopoly</a>
        </header>

        <div class="content auth-content">
            <div class="auth-container">

                <!-- Step 1: Email input -->
                <div id="step-email">
                    <div class="page-title">
                        <h1>Create a game</h1>
                        <p>Enter your email and we'll send a 6-digit code. No password needed.</p>
                    </div>
                    <div class="auth-card">
                        <div class="form-group">
                            <label for="email-input">Email</label>
                            <input type="email" id="email-input" placeholder="you@example.com" autocomplete="email" inputmode="email" required>
                        </div>
                        <div id="email-error" class="error-message"></div>
                        <button id="send-code-btn" class="btn btn-primary">Send Code</button>
                    </div>
                    <a class="quiet-link" href="index.html">Back to home</a>
                </div>

                <!-- Step 2: Code verification -->
                <div id="step-code" style="display: none;">
                    <div class="page-title">
                        <h1>Check your email</h1>
                        <p>We sent a 6-digit code to <strong id="sent-to-email"></strong>.</p>
                    </div>
                    <div class="auth-card">
                        <div class="form-group">
                            <label for="code-input">Code</label>
                            <input type="text" id="code-input" class="code-entry" placeholder="000000" maxlength="6"
                                   inputmode="numeric" autocomplete="one-time-code" required>
                        </div>
                        <div id="code-error" class="error-message"></div>
                        <button id="verify-code-btn" class="btn btn-primary">Verify Code</button>
                    </div>
                    <a class="quiet-link" href="#" id="reset-email-link">Use a different email</a>
                </div>

            </div>
        </div>
    </div>

    <script src="src/js/api.js?v=9"></script>
    <script src="src/js/auth.js?v=5"></script>
</body>
</html>
