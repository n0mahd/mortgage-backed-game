<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ECF1EC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Mortgage Backed">
    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="src/assets/favicon-32.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="src/assets/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Your games — Mortgage Backed Monopoly</title>
    <link rel="preload" href="src/assets/fonts/besley-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="src/css/tokens.css?v=12">
    <link rel="stylesheet" href="src/css/style.css?v=31">
</head>
<body>
    <div class="container">
        <header class="app-bar">
            <a class="app-bar-brand" href="index.html">Mortgage Backed Monopoly</a>
            <div class="user-info">
                <span id="user-email"></span>
                <button id="logout-btn" class="btn btn-ghost btn-sm">Log out</button>
            </div>
        </header>

        <div class="content">
            <div class="lobby-container">
                <div class="page-title">
                    <h1>Your games</h1>
                    <p>Pick up where you left off, or start a new room for your friends.</p>
                </div>

                <div class="lobby-actions">
                    <button id="show-create-room-btn" class="btn btn-primary btn-large">Create New Game</button>
                </div>

                <div class="rooms-section">
                    <div class="section-heading"><h3>Active games</h3></div>
                    <div id="active-rooms-list" class="rooms-list">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Loading your games…</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal" id="createRoomModal">
        <div class="modal-content">
            <div class="modal-header">New game</div>
            <div class="form-group">
                <label for="room-name">Game name</label>
                <input type="text" id="room-name" placeholder="Sunday Night Game" required>
            </div>
            <div class="form-group">
                <label for="max-players">Max players (2–8)</label>
                <input type="number" id="max-players" min="2" max="8" value="4" inputmode="numeric">
            </div>
            <div class="asset-checkbox">
                <input type="checkbox" id="host-spectate">
                <label for="host-spectate">Just watch: only AI agents (and people you invite) play</label>
            </div>
            <div class="form-group" id="host-player-name-group">
                <label for="host-player-name">Your player name</label>
                <input type="text" id="host-player-name" placeholder="Your in-game name" autocomplete="nickname" required>
            </div>
            <div class="sheet-actions">
                <button id="create-room-btn" class="btn btn-success">Create Game</button>
                <button id="cancel-create-room-btn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="src/js/api.js?v=11"></script>
    <script src="src/js/number-inputs.js?v=1"></script>
    <script src="src/js/lobby.js?v=9"></script>
</body>
</html>
