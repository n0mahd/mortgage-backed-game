<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="src/assets/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="src/assets/apple-touch-icon.png">
    <title>Lobby - Mortgage Backed Monopoly</title>
    <link rel="stylesheet" href="src/css/style.css?v=17">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mortgage Backed Monopoly</h1>
            <p><em>If they did it in 2008, it's fair game</em></p>
            <div class="user-info">
                <span id="user-email"></span>
                <button id="logout-btn" class="btn btn-secondary btn-sm">Logout</button>
            </div>
        </div>

        <div class="content">
            <div class="lobby-container">
                <h2>Game Lobby</h2>

                <div class="lobby-actions">
                    <button id="show-create-room-btn" class="btn btn-primary">Create New Game</button>
                </div>

                <div class="rooms-section">
                    <h3>Your Active Games</h3>
                    <div id="active-rooms-list" class="rooms-list">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>Loading your games...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Room Modal -->
    <div class="modal" id="createRoomModal">
        <div class="modal-content">
            <div class="modal-header">Create New Game</div>
            <div class="form-group">
                <label>Game Name:</label>
                <input type="text" id="room-name" placeholder="Sunday Night Game" required>
            </div>
            <div class="form-group">
                <label>Max Players (2-8):</label>
                <input type="number" id="max-players" min="2" max="8" value="4">
            </div>
            <div class="form-group">
                <label>Your Player Name:</label>
                <input type="text" id="host-player-name" placeholder="Your in-game name" required>
            </div>
            <div style="text-align: center;">
                <button id="create-room-btn" class="btn btn-success">Create Game</button>
                <button id="cancel-create-room-btn" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="src/js/api.js?v=7"></script>
    <script src="src/js/lobby.js?v=7"></script>
</body>
</html>
