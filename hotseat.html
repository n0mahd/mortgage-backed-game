<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ECF1EC">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Mortgage Backed">
    <link rel="icon" type="image/svg+xml" href="src/assets/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="src/assets/favicon-32.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="src/assets/apple-touch-icon.png?v=2">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Play on one phone — Mortgage Backed Monopoly</title>
    <link rel="preload" href="src/assets/fonts/besley-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="src/css/tokens.css?v=2">
    <link rel="stylesheet" href="src/css/style.css?v=24">
</head>
<body>
    <div class="container">
        <header class="app-bar">
            <a class="app-bar-brand" href="index.html">Mortgage Backed Monopoly</a>
        </header>

        <div class="content">
            <div class="auth-container">
                <div class="page-title">
                    <h1>Play on one phone</h1>
                    <p>Add 2 to 6 players and pass the phone around. A hand-off screen hides each player's view between turns.</p>
                </div>

                <div class="auth-card">
                    <div id="player-name-fields">
                        <div class="form-group">
                            <label>Player 1</label>
                            <input type="text" class="player-name-input" placeholder="Player 1 name" maxlength="20" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label>Player 2</label>
                            <input type="text" class="player-name-input" placeholder="Player 2 name" maxlength="20" autocomplete="off">
                        </div>
                    </div>

                    <div class="add-player-row">
                        <button class="btn btn-secondary btn-sm" id="add-player-btn">Add Player</button>
                        <span>Up to 6 players</span>
                    </div>

                    <div id="hotseat-error" class="error-message"></div>

                    <button class="btn btn-primary btn-large" id="start-hotseat-btn">Start Local Game</button>
                </div>
                <a class="quiet-link" href="index.html">Back to home</a>
            </div>
        </div>
    </div>

    <script src="src/js/api.js?v=9"></script>
    <script src="src/js/hotseat.js?v=4"></script>
</body>
</html>
